<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GitStory logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- timeline bars (activity) -->
  <g fill="#FFFFFF" fill-opacity="0.22">
    <rect x="46" y="38" width="5" height="12" rx="2"/>
    <rect x="53" y="30" width="5" height="20" rx="2"/>
  </g>
  <!-- main branch -->
  <path d="M20 16V48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- feature branch -->
  <path d="M20 42C20 32 40 36 40 22" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- commit nodes -->
  <circle cx="20" cy="16" r="5.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="3.5"/>
  <circle cx="20" cy="48" r="5.5" fill="#6D28D9" stroke="#FFFFFF" stroke-width="3.5"/>
  <circle cx="40" cy="20" r="5.5" fill="#FBBF24" stroke="#FFFFFF" stroke-width="3.5"/>
</svg>
