apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitstory-api-deployment
  namespace: gitstory-prod
  labels:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: telemetry-api
    feature: git-telemetry-engine
spec:
  replicas: 3 # Dedicated replica set for high-throughput GitHub API aggregation
  selector:
    matchLabels:
      app.kubernetes.io/name: gitstory
      app.kubernetes.io/component: telemetry-api
      feature: git-telemetry-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitstory
        app.kubernetes.io/component: telemetry-api
        feature: git-telemetry-engine
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gitstory-api
          image: arjuna-1/gitstory:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: gitstory-config
            - secretRef:
                name: gitstory-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "384Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
              ephemeral-storage: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/repo?name=facebook/react
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/repo?name=facebook/react
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
