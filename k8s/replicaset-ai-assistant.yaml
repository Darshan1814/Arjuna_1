apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitstory-ai-deployment
  namespace: gitstory-prod
  labels:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: ai-assistant
    feature: arjuna-sarthi-ai
spec:
  replicas: 2 # Dedicated replica set for asynchronous LLM inference & conversational queries
  selector:
    matchLabels:
      app.kubernetes.io/name: gitstory
      app.kubernetes.io/component: ai-assistant
      feature: arjuna-sarthi-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitstory
        app.kubernetes.io/component: ai-assistant
        feature: arjuna-sarthi-ai
    spec:
      containers:
        - name: gitstory-ai
          image: arjuna-1/gitstory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: gitstory-config
            - secretRef:
                name: gitstory-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
