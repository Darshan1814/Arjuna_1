apiVersion: v1
kind: Service
metadata:
  name: gitstory-web-service
  namespace: gitstory-prod
  labels:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: web-ui
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: web-ui
    feature: dashboard-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: gitstory-api-service
  namespace: gitstory-prod
  labels:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: telemetry-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: telemetry-api
    feature: git-telemetry-engine
---
apiVersion: v1
kind: Service
metadata:
  name: gitstory-ai-service
  namespace: gitstory-prod
  labels:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: ai-assistant
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: ai-assistant
    feature: arjuna-sarthi-ai
