apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitstory-alb-ingress
  namespace: gitstory-prod
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
  labels:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/part-of: arjuna-1
spec:
  rules:
    - http:
        paths:
          # AI Assistant & Summarizer Feature Service
          - path: /api/assistant
            pathType: Prefix
            backend:
              service:
                name: gitstory-ai-service
                port:
                  number: 80
          - path: /api/summary
            pathType: Prefix
            backend:
              service:
                name: gitstory-ai-service
                port:
                  number: 80
          - path: /api/readme/summary
            pathType: Prefix
            backend:
              service:
                name: gitstory-ai-service
                port:
                  number: 80

          # Telemetry & Aggregation API Feature Service
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: gitstory-api-service
                port:
                  number: 80

          # Web UI Dashboard Feature Service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitstory-web-service
                port:
                  number: 80
