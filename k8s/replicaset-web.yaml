apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitstory-web-deployment
  namespace: gitstory-prod
  labels:
    app.kubernetes.io/name: gitstory
    app.kubernetes.io/component: web-ui
    feature: dashboard-frontend
spec:
  replicas: 3 # Dedicated replica set for UI dashboard rendering & SSR
  selector:
    matchLabels:
      app.kubernetes.io/name: gitstory
      app.kubernetes.io/component: web-ui
      feature: dashboard-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitstory
        app.kubernetes.io/component: web-ui
        feature: dashboard-frontend
    spec:
      containers:
        - name: gitstory-web
          image: arjuna-1/gitstory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: gitstory-config
            - secretRef:
                name: gitstory-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
