apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gitstory-web-hpa
  namespace: gitstory-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gitstory-web-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
